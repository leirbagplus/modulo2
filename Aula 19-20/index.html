<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Aula Flexbox</title>
  </head>
  <body>
    <!-- As tags header, main e footer são importantes para compreender a hierarquia do conteúdo do site. Separando-o em "camadas". -->
    <header class="cabecalho">
      <h1>Minha Loja</h1>
      <!-- nav=Área de navegação -->
      <nav class="menu">
        <a href="#">Início</a>
        <a href="#">Produtos</a>
        <a href="#">Contato</a>
      </nav>
    </header>

    <main>
      <!-- Agrupa os conteúdos iguais -->
      <section class="cards">
        <div class="produtos">
          <h2>Produto 1</h2>
          <p>Descrição do produto</p>
          <button>Comprar</button>
        </div>

        <div class="produtos">
          <h2>Produto 2</h2>
          <p>Descrição do produto</p>
          <button>Comprar</button>
        </div>

        <div class="produtos">
          <h2>Produto 3</h2>
          <p>Descrição do produto</p>
          <button>Comprar</button>
        </div>

        <div class="produtos">
          <h2>Produto 4</h2>
          <p>Descrição do produto</p>
          <button>Comprar</button>
        </div>
      </section>
    </main>
    <!-- Footer feito na aula 20 -->
    <footer>
      <p>&copy; 2026 Minha Loja- Todos os direitos reservados</p>

      <div class="redes-sociais">
        <a href="#"
          ><img src="img/instagram-svgrepo-com.svg" alt="logo instagram"
        /></a>
        <a href="#"
          ><img src="img/linkedin-svgrepo-com.svg" alt="logo linkedin"
        /></a>
      </div>
    </footer>
  </body>
</html>
