<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formularios</title>
  </head>
  <body>
    <form action="#">
      <label for="nome">Nome</label>
      <input
        type="text"
        name="nome"
        id="nome"
        placeholder="Digite o seu nome"
        required
      />
      <br /><br />
      <label for="email">Email</label>
      <input
        type="email"
        name="email"
        id="email"
        placeholder="seuemail@email.com"
      />
      <br /><br />
      <label for="senha">senha</label>
      <input
        type="password"
        name="senha"
        id="senha"
        placeholder="Digite a sua senha"
      />
      <br /><br />
      <label for="telefone">telefone</label>
      <input type="tel" name="telefone" id="telefone" placeholder="99999999" />
      <br /><br />
      <label for="data">Data de nascimento</label>
      <input type="date" name="data" id="data" />
      <br /><br />
      <p>escolha o seu turno:</p>
      <br />
      <input type="radio" name="turno" id="manha" />
      <label for="manha">Manhã</label>
      <input type="radio" name="turno" id="tarde" />
      <label for="tarde">Tarde</label>
      <input type="radio" name="turno" id="noite" />
      <label for="noite">Noite</label>
      <br /><br />
      <p>escolha a área dev</p>
      <input type="checkbox" name="area" id="front" value="front" />
      <label for="front">Frontend</label>
      <input type="checkbox" name="area" id="back" value="back" />
      <label for="back">Backend</label>
    </form>
  </body>
</html>
